name: gdg_guess_game
description: A guess image game with multiple categories.
publish_to: 'none'

version: 0.30.5+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  path: ^1.8.3
  cupertino_icons: ^1.0.2
  flutter_staggered_animations: ^1.1.1
  flutter_riverpod: ^2.6.1
  win32: '>=5.0.0 <7.0.0'
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  dio: ^5.7.0
  open_filex: ^4.5.0
  shorebird_code_push: ^2.0.7
  restart_app: ^1.3.2
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/profile/
    - assets/fonts/
    - assets/images/
    - assets/images/attack_on_titan/
    - assets/images/black_clover/
    - assets/images/demon_slayer/
    - assets/images/hunter_x_hunter/
    - assets/images/naruto/
    - assets/images/one_piece/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/biguess-icon.webp"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logos/biguess-icon.webp"
  windows:
    generate: true
    image_path: "assets/logos/biguess-icon.webp"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logos/biguess-icon.webp"