name: gdg_guess_game
description: A guess image game with multiple categories.
publish_to: 'none'

version: 0.32.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  path: ^1.8.3
  cupertino_icons: ^1.0.2
  flutter_staggered_animations: ^1.1.1
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  dio: ^5.7.0
  open_filex: ^4.5.0
  shorebird_code_push: ^2.0.7
  restart_app: ^1.3.2
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/profile/
    - assets/fonts/
    # Anime Topic
    - assets/images/Anime/Attack on Titan/
    - assets/images/Anime/Black Clover/
    - assets/images/Anime/Demon Slayer/
    - assets/images/Anime/Hunter X Hunter/
    - assets/images/Anime/Naruto/
    - assets/images/Anime/One Piece/
    # Geography Topic
    - assets/images/Geography/Flags/
    - shorebird.yaml

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logos/biguess-icon.webp"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logos/biguess-icon.webp"